name: Update Homebrew Cask

# This workflow can be triggered manually or called via repository_dispatch
# from the main multi-agent-ide repo when a new release is published.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without 'v' prefix, e.g. 0.1.0)"
        required: true
        type: string
      source_repo:
        description: "Source GitHub repository in owner/repo format"
        required: false
        default: "baoduy/multi-agent-ide"
        type: string
  repository_dispatch:
    types: [release-published]

jobs:
  update-cask:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tap repo
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            VERSION="${{ github.event.client_payload.version }}"
          else
            VERSION="${{ inputs.version }}"
          fi
          # Strip leading 'v' if present
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine source repository
        id: source
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            SOURCE_REPO="${{ github.event.client_payload.source_repo }}"
          else
            SOURCE_REPO="${{ inputs.source_repo }}"
          fi

          if [ -z "$SOURCE_REPO" ]; then
            SOURCE_REPO="baoduy/multi-agent-ide"
          fi

          case "$SOURCE_REPO" in
            */*) ;;
            *)
              echo "Invalid source_repo value: $SOURCE_REPO (expected owner/repo)" >&2
              exit 1
              ;;
          esac

          echo "source_repo=$SOURCE_REPO" >> "$GITHUB_OUTPUT"

      - name: Download release assets and compute SHA256
        id: sha
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_REPO: ${{ steps.source.outputs.source_repo }}
        run: |
          API_BASE="https://api.github.com/repos/${SOURCE_REPO}/releases/tags"
          RETRY_ATTEMPTS=12
          RETRY_DELAY_SECONDS=15

          RELEASE_TAG=""
          for ATTEMPT in $(seq 1 "$RETRY_ATTEMPTS"); do
            for TAG in "v${VERSION}" "${VERSION}"; do
              if curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 "${API_BASE}/${TAG}" -o release.json; then
                RELEASE_TAG="$TAG"
                break
              fi
            done

            if [ -n "$RELEASE_TAG" ]; then
              break
            fi

            echo "Release not found yet in ${SOURCE_REPO} for version ${VERSION} (attempt ${ATTEMPT}/${RETRY_ATTEMPTS}). Waiting ${RETRY_DELAY_SECONDS}s..."
            sleep "$RETRY_DELAY_SECONDS"
          done

          if [ -z "$RELEASE_TAG" ]; then
            echo "Release not found in ${SOURCE_REPO} for version ${VERSION} (tried tags: v${VERSION}, ${VERSION})" >&2
            exit 1
          fi

          echo "Using release tag: ${RELEASE_TAG}"

          ARM_URL=""
          X64_URL=""
          for ATTEMPT in {1..20}; do
            ARM_URL=$(ruby -rjson -e 'j=JSON.parse(File.read("release.json")); a=j.fetch("assets",[]).find{|x| x["name"].to_s.end_with?("-mac-arm64.dmg")}; puts(a ? a["browser_download_url"] : "")')
            X64_URL=$(ruby -rjson -e 'j=JSON.parse(File.read("release.json")); a=j.fetch("assets",[]).find{|x| x["name"].to_s.end_with?("-mac-x64.dmg")}; puts(a ? a["browser_download_url"] : "")')

            if [ -n "$ARM_URL" ] && [ -n "$X64_URL" ]; then
              break
            fi

            echo "Assets not ready yet (attempt ${ATTEMPT}/20). Waiting 15s..."
            sleep 15
            curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 "${API_BASE}/${RELEASE_TAG}" -o release.json
          done

          if [ -z "$ARM_URL" ] || [ -z "$X64_URL" ]; then
            echo "Could not find required DMG assets in release ${RELEASE_TAG}." >&2
            echo "Expected assets ending with -mac-arm64.dmg and -mac-x64.dmg." >&2
            exit 1
          fi

          echo "Downloading arm64 DMG..."
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 "$ARM_URL" -o arm64.dmg
          ARM64_MIME=$(file --brief --mime-type arm64.dmg)
          if [ "$ARM64_MIME" != "application/x-apple-diskimage" ] && [ "$ARM64_MIME" != "application/octet-stream" ] && [ "$ARM64_MIME" != "application/zlib" ]; then
            echo "arm64 asset is not a DMG file (mime-type: $ARM64_MIME)" >&2
            exit 1
          fi
          SHA_ARM64=$(shasum -a 256 arm64.dmg | awk '{print $1}')
          echo "arm64 SHA256: $SHA_ARM64"

          echo "Downloading x64 DMG..."
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 "$X64_URL" -o x64.dmg
          X64_MIME=$(file --brief --mime-type x64.dmg)
          if [ "$X64_MIME" != "application/x-apple-diskimage" ] && [ "$X64_MIME" != "application/octet-stream" ] && [ "$X64_MIME" != "application/zlib" ]; then
            echo "x64 asset is not a DMG file (mime-type: $X64_MIME)" >&2
            exit 1
          fi
          SHA_X64=$(shasum -a 256 x64.dmg | awk '{print $1}')
          echo "x64 SHA256: $SHA_X64"

          echo "sha_arm64=$SHA_ARM64" >> "$GITHUB_OUTPUT"
          echo "sha_x64=$SHA_X64" >> "$GITHUB_OUTPUT"

      - name: Update cask formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA_ARM64: ${{ steps.sha.outputs.sha_arm64 }}
          SHA_X64: ${{ steps.sha.outputs.sha_x64 }}
        run: |
          CASK_FILE="Casks/magenta-ide.rb"

          cat > "$CASK_FILE" << RUBY
          cask "magenta-ide" do
            version "${VERSION}"

            on_arm do
              sha256 "${SHA_ARM64}"
              url "https://github.com/${{ steps.source.outputs.source_repo }}/releases/download/v#{version}/Magenta.IDE-#{version}-mac-arm64.dmg"
            end

            on_intel do
              sha256 "${SHA_X64}"
              url "https://github.com/${{ steps.source.outputs.source_repo }}/releases/download/v#{version}/Magenta.IDE-#{version}-mac-x64.dmg"
            end

            name "Magenta IDE"
            desc "Multi-repo multi-agent IDE for spec-driven development"
            homepage "https://github.com/${{ steps.source.outputs.source_repo }}"

            depends_on macos: ">= :ventura"

            app "Magenta IDE.app"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-cr", "#{appdir}/Magenta IDE.app"]
            end

            zap trash: [
              "~/Library/Application Support/Magenta IDE",
              "~/Library/Preferences/com.magenta-ide.plist",
              "~/Library/Logs/Magenta IDE",
            ]
          end
          RUBY

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' "$CASK_FILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/magenta-ide.rb
          git commit -m "Update magenta-ide to v${{ steps.version.outputs.version }}"
          git push
